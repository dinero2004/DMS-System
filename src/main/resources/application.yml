spring:
  application:
    name: dms-valuation-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dms_valuation}
    username: ${DB_USERNAME:dms_user}
    password: ${DB_PASSWORD:dms_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
