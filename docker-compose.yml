# Convenience: same Postgres as backend/compose.yml (for `docker compose up -d` from repo root)
include:
  - path: backend/compose.yml

services:
  postgres:
    volumes:
      - dealerops-db-data:/var/lib/postgresql/data

  dealerops-api:
    build:
      context: ./backend
    container_name: dms-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dms
      SPRING_DATASOURCE_USERNAME: dms
      SPRING_DATASOURCE_PASSWORD: dms
      SERVER_PORT: 8080
      DMS_SEED_ENABLED: "true"
      DMS_AUTH_USERNAME: demo
      DMS_AUTH_PASSWORD: demo
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  veloce-web:
    build:
      context: ./dealer-management-systems/veloce-dms
    container_name: veloce-cockpit
    environment:
      PORT: 8080
      DMS_BACKEND_URL: http://dealerops-api:8080
      DMS_BACKEND_TIMEOUT_MS: 8000
    ports:
      - "15175:8080"
    depends_on:
      - dealerops-api

volumes:
  dealerops-db-data:
    name: dealerops-db-data
